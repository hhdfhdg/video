<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>АПОКАЛИПСИС — вертикальное видео 1080x1920</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <!-- Весь кадр (сцены + субтитры + зерно/виньетка/glitch) рисует script.js -->
    <canvas id="scene" width="1080" height="1920"></canvas>
    <div id="cssfx" aria-hidden="true"></div>
  </div>
  <div id="previewbar">
    <input id="slider" type="range" min="0" max="60" step="0.0333" value="0" />
    <span id="timelabel">t = 0.000 s</span>
    <button id="playBtn">&#9654; Play (live)</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
