<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cogniflux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app" class="app"></div>
  <div id="menu-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toasts" aria-live="polite"></div>
  <div id="overlay" class="overlay" data-action="overlayClose"></div>

  <input type="file" id="file-input" multiple hidden accept=".txt,.md,.csv,.json,.log,.py,.js,.html,.css,.xml,.yaml,.yml,.pdf,.docx">
  <input type="file" id="image-input" multiple hidden accept="image/png,image/jpeg,image/webp">
  <input type="file" id="import-input" hidden accept="application/json,.json">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
